<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HASP Ground Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:     #070c17;
      --bg-base:     #0b1120;
      --bg-card:     #101828;
      --bg-card-alt: #0d1422;
      --bg-hover:    #16233a;
      --bg-selected: #132140;
      --border:      #1c2d45;
      --border-mid:  #263d57;
      --text:        #e2e8f0;
      --text-dim:    #8fa8c8;
      --text-muted:  #3d5470;
      --accent:      #38bdf8;
      --green:       #34d399;
      --green-bg:    #031f12;
      --red:         #f87171;
      --red-bg:      #1a0a0a;
      --yellow:      #fbbf24;
      --font-ui:     'Inter', system-ui, sans-serif;
      --font-mono:   'JetBrains Mono', 'Courier New', monospace;
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex; flex-direction: column;
      background: var(--bg-base); color: var(--text);
      font-family: var(--font-ui); font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollbars ──────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 3px; }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      flex-shrink: 0;
      background: linear-gradient(120deg, #080f22 0%, #0d1f42 100%);
      border-bottom: 1px solid #1a3050;
      padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, #1a4fc4, #0891b2);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
      box-shadow: 0 0 14px rgba(56,189,248,.2);
    }
    .brand-title { font-size: 15px; font-weight: 700; letter-spacing: .03em; color: #f1f5f9; }
    .brand-sub   { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    #header-stats { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; letter-spacing: .02em; border: 1px solid;
    }
    .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .pill-blue  { color: #60a5fa; border-color: #1a3a5f; background: #0a1e38; }
    .pill-green { color: var(--green); border-color: #064e38; background: var(--green-bg); }
    .pill-red   { color: var(--red);  border-color: #6b1414; background: var(--red-bg); }
    .pill-gray  { color: var(--text-dim); border-color: var(--border); background: var(--bg-card); }

    /* ── Input panel ─────────────────────────────────────────────────────── */
    .input-panel {
      flex-shrink: 0;
      background: var(--bg-base); border-bottom: 1px solid var(--border);
      padding: 10px 24px; display: flex; gap: 10px; align-items: flex-start;
    }
    textarea#input-area {
      flex: 1; min-width: 0;
      background: var(--bg-deep); border: 1px solid var(--border-mid);
      border-radius: 7px; color: #4ade80;
      font-family: var(--font-mono); font-size: 11px; line-height: 1.65;
      padding: 10px 13px; resize: none; height: 90px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea#input-area::placeholder { color: #1c3050; }
    textarea#input-area:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56,189,248,.1);
    }
    .btn-col { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 7px 15px; border-radius: 7px; font-size: 12px; font-weight: 500;
      border: 1px solid var(--border-mid); background: var(--bg-card); color: #c9d1d9;
      cursor: pointer; font-family: var(--font-ui);
      transition: background .1s, border-color .1s, color .1s;
      white-space: nowrap; user-select: none; min-width: 108px;
    }
    .btn:hover  { background: var(--bg-hover); border-color: var(--accent); color: #fff; }
    .btn:active { background: var(--bg-selected); }
    .btn-primary { background: #1a4bc4; border-color: #2d64e0; color: #fff; }
    .btn-primary:hover { background: #2558d8; border-color: #5080f8; }

    /* ── Status strip ────────────────────────────────────────────────────── */
    #status-bar {
      flex-shrink: 0; padding: 5px 24px;
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 500;
      border-bottom: 1px solid var(--border);
      background: var(--bg-base); color: var(--text-muted);
      transition: background .25s, color .25s;
    }
    #status-bar .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    /* ── Main layout ─────────────────────────────────────────────────────── */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── Packet table ────────────────────────────────────────────────────── */
    .table-wrap {
      display: flex; flex-direction: column; flex: 1; min-width: 0;
      overflow: hidden; border-right: 1px solid var(--border);
    }
    .panel-bar {
      flex-shrink: 0; padding: 7px 16px;
      background: var(--bg-base); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-label {
      font-size: 10px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text-muted);
    }
    .table-scroll { flex: 1; overflow: auto; }

    table#packet-table { width: 100%; border-collapse: collapse; }
    table#packet-table thead th {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg-deep); padding: 8px 14px;
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-muted); text-align: left;
      border-bottom: 1px solid var(--border-mid); white-space: nowrap;
    }
    table#packet-table tbody tr {
      cursor: pointer; border-bottom: 1px solid var(--border);
      transition: background .07s;
    }
    table#packet-table tbody tr:hover     td { background: var(--bg-hover); }
    table#packet-table tbody tr.selected  td { background: var(--bg-selected); }
    table#packet-table tbody tr.selected  td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
    table#packet-table tbody tr.bad       td { background: #100808; }
    table#packet-table tbody tr.bad:hover td { background: #180e0e; }
    table#packet-table tbody tr.bad.selected td { background: #1a0e18; }
    table#packet-table tbody td {
      padding: 8px 14px; color: var(--text);
      font-family: var(--font-mono); font-size: 11px; white-space: nowrap;
    }
    table#packet-table tbody td.dim { color: var(--text-muted); font-size: 10.5px; }

    .badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 8px; border-radius: 5px;
      font-size: 10px; font-weight: 700; letter-spacing: .05em; border: 1px solid;
    }
    .ok   { color: var(--green); border-color: #064e38; background: var(--green-bg); }
    .fail { color: var(--red);   border-color: #6b1414; background: var(--red-bg); }

    /* ── Detail panel ────────────────────────────────────────────────────── */
    .resize-handle {
      flex-shrink: 0; width: 6px; cursor: col-resize;
      background: transparent; position: relative;
    }
    .resize-handle::after {
      content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 2px;
      background: var(--border-mid);
    }
    .resize-handle:hover::after, .resize-handle.dragging::after { background: var(--accent); }

    .detail-wrap {
      flex-shrink: 0; width: 400px; min-width: 260px; max-width: 900px;
      display: flex; flex-direction: column;
      background: var(--bg-base); overflow: hidden;
    }
    #detail-scroll { flex: 1; overflow-y: auto; padding: 10px; }

    .advanced-toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text-dim); cursor: pointer; user-select: none;
    }
    .advanced-toggle input { accent-color: var(--accent); cursor: pointer; }

    .dg { margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .dg-head {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; background: var(--bg-card);
      font-size: 10px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--text-dim);
    }
    .dg-stripe { width: 3px; height: 13px; border-radius: 2px; flex-shrink: 0; }

    .dg-row { display: flex; align-items: baseline; border-top: 1px solid var(--border); }
    .dg-row:nth-child(even) { background: var(--bg-card-alt); }
    .dg-row:nth-child(odd)  { background: var(--bg-card); }
    .dg-key {
      flex-shrink: 0; width: 168px; padding: 5px 12px;
      font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
      border-right: 1px solid var(--border);
    }
    .dg-val {
      flex: 1; padding: 5px 12px;
      font-family: var(--font-mono); font-size: 11px;
      color: var(--text); word-break: break-all;
    }
    .dg-val.good { color: var(--green); font-weight: 600; }
    .dg-val.bad  { color: var(--red);   font-weight: 600; }
    .dg-val.hex  { font-size: 9px; letter-spacing: .05em; color: var(--text-dim); }

    /* SiPM 4×4 grid */
    .sipm-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border);
    }
    .sipm-cell {
      padding: 9px 6px; text-align: center;
      background: var(--bg-card-alt);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .sipm-cell:nth-child(4n)       { border-right: none; }
    .sipm-cell:nth-last-child(-n+4){ border-bottom: none; }
    .sipm-ch  { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); margin-bottom: 3px; }
    .sipm-val { font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: #1e3a5f; }
    .sipm-val.lit {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(56,189,248,.55);
    }

    /* Empty states */
    .empty { color: var(--text-muted); text-align: center; font-size: 12px; padding: 60px 0; }

    /* ── View tabs ───────────────────────────────────────────────────────── */
    .view-tabs { display: flex; gap: 4px; }
    .tab-btn {
      background: transparent; border: 1px solid transparent; color: var(--text-muted);
      font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; padding: 4px 10px; border-radius: 6px; cursor: pointer;
    }
    .tab-btn:hover { color: var(--text-dim); background: var(--bg-hover); }
    .tab-btn.active { color: var(--accent); background: var(--bg-selected); border-color: var(--border-mid); }

    /* ── Graphs view ─────────────────────────────────────────────────────── */
    .graphs-view { flex: 1; overflow-y: auto; padding: 14px; }
    .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; }
    .chart-block { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg-card-alt); }
    .chart-block.advanced-chart { display: none; }
    .graphs-view.show-advanced .chart-block.advanced-chart { display: block; }
    .chart-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 7px 12px; background: var(--bg-card);
      font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim);
    }
    .chart-head-title { display: flex; align-items: center; gap: 8px; }
    .chart-unit { color: var(--text-muted); font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 10px; }
    .chart-canvas-wrap { position: relative; height: 190px; padding: 8px 10px 2px; }
    .chart-canvas-wrap canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
    .chart-tooltip {
      position: absolute; pointer-events: none; z-index: 20; display: none;
      background: var(--bg-deep); border: 1px solid var(--border-mid); border-radius: 6px;
      padding: 6px 9px; font-family: var(--font-mono); font-size: 10px; color: var(--text);
      box-shadow: 0 6px 18px rgba(0,0,0,.4); white-space: nowrap;
    }
    .chart-tooltip .tt-x { color: var(--text-muted); margin-bottom: 3px; font-size: 9.5px; }
    .chart-tooltip .tt-row { display: flex; align-items: center; gap: 5px; }
    .chart-tooltip .tt-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 6px 12px 10px; }
    .legend-chip {
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none;
      font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
    }
    .legend-chip.off { color: var(--text-muted); text-decoration: line-through; opacity: .55; }
    .legend-swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

    /* ── Mode switcher ───────────────────────────────────────────────────── */
    .mode-bar {
      flex-shrink: 0; display: flex; gap: 2px;
      background: var(--bg-deep); border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    .mode-btn {
      background: transparent; border: none; border-bottom: 2px solid transparent;
      color: var(--text-muted); font-family: var(--font-ui); font-size: 12px; font-weight: 600;
      padding: 9px 14px; cursor: pointer; transition: color .1s, border-color .1s;
    }
    .mode-btn:hover { color: var(--text-dim); }
    .mode-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Uplink command maker ────────────────────────────────────────────── */
    .uplink-view { flex: 1; display: flex; overflow: hidden; }
    .uplink-sidebar {
      width: 380px; min-width: 280px; max-width: 520px; flex-shrink: 0;
      display: flex; flex-direction: column; overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .uplink-search-wrap { flex-shrink: 0; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    input.uplink-search {
      width: 100%; background: var(--bg-deep); border: 1px solid var(--border-mid);
      border-radius: 7px; color: var(--text); font-family: var(--font-ui); font-size: 12px;
      padding: 7px 11px; outline: none;
    }
    input.uplink-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.1); }
    .uplink-list { flex: 1; overflow-y: auto; }
    .uplink-cat {
      padding: 7px 14px 4px; font-size: 9.5px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--text-muted); background: var(--bg-base);
      position: sticky; top: 0;
    }
    .uplink-item {
      padding: 8px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
      transition: background .07s;
    }
    .uplink-item:hover { background: var(--bg-hover); }
    .uplink-item.selected { background: var(--bg-selected); box-shadow: inset 3px 0 0 var(--accent); }
    .uplink-item-name { font-size: 12px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
    .uplink-item-code { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-muted); font-weight: 500; }
    .uplink-item-desc {
      font-size: 10.5px; color: var(--text-dim); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .uplink-item-param {
      display: inline-block; font-size: 8.5px; font-weight: 700; letter-spacing: .05em;
      color: var(--yellow); border: 1px solid #4d3b06; background: #1a1200;
      border-radius: 4px; padding: 1px 5px; margin-left: 4px;
    }

    .uplink-detail { flex: 1; overflow-y: auto; padding: 22px; }
    .uplink-detail-cat { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    .uplink-detail-title { font-size: 18px; font-weight: 700; color: #f1f5f9; margin-bottom: 8px; }
    .uplink-detail-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.6; margin-bottom: 22px; max-width: 560px; }

    .uplink-param-row { margin-bottom: 22px; }
    .uplink-param-label { font-size: 11px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; display: block; }
    input.uplink-param-input {
      width: 140px; background: var(--bg-deep); border: 1px solid var(--border-mid);
      border-radius: 7px; color: var(--accent); font-family: var(--font-mono); font-size: 14px;
      padding: 8px 12px; outline: none;
    }
    input.uplink-param-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.1); }
    .uplink-param-hint { font-size: 10.5px; color: var(--text-muted); margin-top: 5px; }

    .uplink-result {
      border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card-alt);
      padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
      max-width: 560px;
    }
    .uplink-result-bytes { font-family: var(--font-mono); font-size: 22px; font-weight: 600; color: var(--accent); letter-spacing: .04em; }
    .copy-btn.copied { background: var(--green-bg); border-color: #064e38; color: var(--green); }
  </style>
</head>

<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header>
    <div class="brand">
      <div class="brand-icon">🛰</div>
      <div>
        <div class="brand-title">HASP Ground Control</div>
        <div class="brand-sub">Downlink Telemetry Decoder</div>
      </div>
    </div>
    <div id="header-stats"></div>
  </header>

  <!-- ── Mode switcher ──────────────────────────────────────────────────── -->
  <div class="mode-bar">
    <button class="mode-btn active" id="mode-btn-downlink" onclick="switchMode('downlink')">📡&thinsp;Downlink Decoder</button>
    <button class="mode-btn" id="mode-btn-uplink" onclick="switchMode('uplink')">📤&thinsp;Uplink Commands</button>
  </div>

  <div id="downlink-view" style="display:contents">

  <!-- ── Input panel ────────────────────────────────────────────────────── -->
  <div class="input-panel">
    <textarea id="input-area"
      placeholder="Paste raw downlink lines here  (DOWNLINK_HEX …  or bare 50-byte hex) …"></textarea>
    <div class="btn-col">
      <button class="btn btn-primary" onclick="decodeInput()">▶&thinsp;Decode</button>
      <label class="btn" style="cursor:pointer">
        📂&thinsp;Open File
        <input type="file" style="display:none" onchange="openFile(this)">
      </label>
      <button class="btn" onclick="clearAll()">✕&thinsp;Clear</button>
    </div>
  </div>

  <!-- ── Status strip ───────────────────────────────────────────────────── -->
  <div id="status-bar">
    <span class="dot"></span>
    <span id="status-msg">Ready — paste data or open a file, then click Decode.</span>
  </div>

  <!-- ── Main ───────────────────────────────────────────────────────────── -->
  <div class="main">

    <!-- Packet table -->
    <div class="table-wrap">
      <div class="panel-bar">
        <div class="view-tabs">
          <button class="tab-btn active" id="tab-btn-table" onclick="switchView('table')">Packets</button>
          <button class="tab-btn" id="tab-btn-graphs" onclick="switchView('graphs')">Graphs</button>
        </div>
        <button class="btn" style="min-width:0;padding:4px 11px;font-size:11px" onclick="downloadCsv()">
          ⬇&thinsp;Download CSV
        </button>
      </div>
      <div class="table-scroll" id="table-view">
        <table id="packet-table">
          <thead>
            <tr>
              <th>Pkt #</th><th>Seq #</th><th>Timestamp (UTC)</th>
              <th>Alt (m)</th><th>Pres (mbar)</th><th>Satellites</th><th>CRC</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="7" class="empty">No packets decoded yet.</td></tr>
          </tbody>
        </table>
      </div>
      <div class="graphs-view" id="graphs-view" style="display:none">
        <div class="chart-grid" id="default-charts"></div>
      </div>
    </div>

    <!-- Resize handle -->
    <div class="resize-handle" id="resize-handle"></div>

    <!-- Detail panel -->
    <div class="detail-wrap" id="detail-wrap">
      <div class="panel-bar">
        <span class="panel-label">Packet Details</span>
        <label class="advanced-toggle">
          <input type="checkbox" id="advanced-toggle" onchange="toggleAdvanced(this.checked)">
          Advanced
        </label>
      </div>
      <div id="detail-scroll">
        <div class="empty" style="margin-top:60px">Select a packet to inspect it.</div>
      </div>
    </div>

  </div><!-- /main -->

  </div><!-- /downlink-view -->

  <!-- ── Uplink command maker ───────────────────────────────────────────── -->
  <div class="uplink-view" id="uplink-view" style="display:none">
    <div class="uplink-sidebar">
      <div class="panel-bar">
        <span class="panel-label">Commands</span>
      </div>
      <div class="uplink-search-wrap">
        <input type="text" id="uplink-search" class="uplink-search"
          placeholder="Search commands or descriptions…" oninput="renderUplinkList()">
      </div>
      <div class="uplink-list" id="uplink-list"></div>
    </div>
    <div class="uplink-detail" id="uplink-detail">
      <div class="empty" style="margin-top:80px">Select a command to build it.</div>

    function distinctColor(i, total) {

    function formatX(pkt) {
      if (pkt.timestamp_unix) {
        const m = String(pkt.timestamp_utc).match(/T(\d\d:\d\d:\d\d)/);
        if (m) return m[1];
      }
      return `#${pkt.sequence_number}`;

    class TimeChart {
      constructor(canvas, tooltipEl, legendEl, seriesDefs) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.tooltipEl = tooltipEl;
        this.legendEl = legendEl;
        this.series = seriesDefs; // [{key,label,color}]
        this.hidden = new Set();
        this.data = [];
        this._layout = null;
        this._renderLegend();
        this._bindEvents();
        new ResizeObserver(() => this.draw()).observe(canvas.parentElement);
      }

      setData(pkts) { this.data = pkts; this.draw(); }

      _renderLegend() {
        this.legendEl.innerHTML = this.series.map(s => `
          <span class="legend-chip" data-key="${s.key}">
            <span class="legend-swatch" style="background:${s.color}"></span>${s.label}
          </span>`).join('');
        this.legendEl.querySelectorAll('.legend-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            const key = chip.dataset.key;
            if (this.hidden.has(key)) this.hidden.delete(key); else this.hidden.add(key);
            chip.classList.toggle('off', this.hidden.has(key));
            this.draw();
          });
        });
      }

      _bindEvents() {
        this.canvas.addEventListener('mousemove', (e) => this._onHover(e));
        this.canvas.addEventListener('mouseleave', () => { this.tooltipEl.style.display = 'none'; });
      }

      _onHover(e) {
        if (!this._layout || !this.data.length) return;
        const rect = this.canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const { padL, padR, w, n } = this._layout;
        const usable = Math.max(w - padL - padR, 1);
        let idx = Math.round(((mx - padL) / usable) * (n - 1));
        idx = Math.max(0, Math.min(n - 1, idx));
        const pkt = this.data[idx];
        const visible = this.series.filter(s => !this.hidden.has(s.key));
        if (!visible.length) { this.tooltipEl.style.display = 'none'; return; }
        this.tooltipEl.innerHTML = `<div class="tt-x">${formatX(pkt)} · seq ${pkt.sequence_number}</div>` +
          visible.map(s => `<div class="tt-row"><span class="tt-dot" style="background:${s.color}"></span>${s.label}: <b>${pkt[s.key] ?? '—'}</b></div>`).join('');
        this.tooltipEl.style.display = 'block';
        const wrapRect = this.canvas.parentElement.getBoundingClientRect();
        let left = mx + 14;
        if (left + 150 > wrapRect.width) left = mx - 160;
        this.tooltipEl.style.left = `${left}px`;
        this.tooltipEl.style.top = `10px`;
      }

      draw() {
        const canvas = this.canvas, ctx = this.ctx;
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(rect.width, 10), h = Math.max(rect.height, 10);
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, w, h);

        const padL = 42, padR = 8, padT = 10, padB = 20;
        this._layout = { padL, padR, w, h, n: this.data.length };

        if (!this.data.length) {
          ctx.fillStyle = '#3d5470';
          ctx.font = '11px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('No data yet', w / 2, h / 2);
          return;
        }

        const visible = this.series.filter(s => !this.hidden.has(s.key));
        let min = Infinity, max = -Infinity;
        visible.forEach(s => {
          this.data.forEach(p => {
            const v = Number(p[s.key]);
            if (Number.isFinite(v)) { if (v < min) min = v; if (v > max) max = v; }
          });
        });
        if (!Number.isFinite(min) || !Number.isFinite(max)) { min = 0; max = 1; }
        if (min === max) { min -= 1; max += 1; }
        const pad = (max - min) * 0.08;
        min -= pad; max += pad;

        const n = this.data.length;
        const usableW = w - padL - padR, usableH = h - padT - padB;
        const xAt = (i) => padL + (n > 1 ? (i * usableW) / (n - 1) : usableW / 2);
        const yAt = (v) => padT + usableH - ((v - min) / (max - min)) * usableH;

        // grid + y labels
        ctx.strokeStyle = '#1c2d45';
        ctx.fillStyle = '#3d5470';
        ctx.font = '9px JetBrains Mono, monospace';
        ctx.textAlign = 'right';
        const gridLines = 4;
        for (let g = 0; g <= gridLines; g++) {
          const v = min + ((max - min) * g) / gridLines;
          const y = yAt(v);
          ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.lineWidth = 1; ctx.stroke();
          ctx.fillText(Math.abs(v) >= 100 ? Math.round(v) : (Math.round(v * 10) / 10), padL - 6, y + 3);
        }

        // x labels
        ctx.textAlign = 'center';
        const xTicks = Math.min(5, n);
        for (let t = 0; t < xTicks; t++) {
          const idx = xTicks > 1 ? Math.round((t * (n - 1)) / (xTicks - 1)) : 0;
          ctx.fillText(formatX(this.data[idx]), xAt(idx), h - 5);
        }

        // series lines
        visible.forEach(s => {
          ctx.strokeStyle = s.color;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          let started = false;
          this.data.forEach((p, i) => {
            const v = Number(p[s.key]);
            if (!Number.isFinite(v)) { started = false; return; }
            const x = xAt(i), y = yAt(v);
            if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
          });
          ctx.stroke();
        });
      }
    }

    let allCharts = [];

    function buildChartBlock(container, title, unit, seriesDefs, { advanced = false } = {}) {
      const block = document.createElement('div');
      block.className = 'chart-block' + (advanced ? ' advanced-chart' : '');
      block.innerHTML = `
        <div class="chart-head">
          <div class="chart-head-title">${title} ${unit ? `<span class="chart-unit">(${unit})</span>` : ''}</div>
        </div>
        <div class="chart-canvas-wrap">
          <canvas></canvas>
          <div class="chart-tooltip"></div>
        </div>
        <div class="chart-legend"></div>`;
      container.appendChild(block);

      const chart = new TimeChart(
        block.querySelector('canvas'),
        block.querySelector('.chart-tooltip'),
        block.querySelector('.chart-legend'),
        seriesDefs,
      );
      chart.setData(packets);
      allCharts.push(chart);
      return chart;
    }

    function initDefaultCharts() {
      const container = document.getElementById('default-charts');

      buildChartBlock(container, 'SiPM Trigger Counts', 'counts',
        FIELD_CATALOG.filter(f => f.group === 'SiPM Trigger Counts')
          .map((f, i) => ({ key: f.key, label: f.label, color: distinctColor(i, 16) })));

      buildChartBlock(container, 'Temperatures', '°C',
        FIELD_CATALOG.filter(f => f.group === 'Temperatures')
          .map((f, i, arr) => ({ key: f.key, label: f.label, color: distinctColor(i, arr.length) })));

      buildChartBlock(container, 'Altitude', 'm',
        [{ key: 'altitude_m', label: 'Altitude', color: '#38bdf8' }]);

      buildChartBlock(container, 'Pressure', 'mbar',
        [{ key: 'pressure_mbar', label: 'Pressure', color: '#34d399' }]);

      buildChartBlock(container, 'Magnetometer', 'µT',
        FIELD_CATALOG.filter(f => f.group === 'Magnetometer')
          .map((f, i) => ({ key: f.key, label: f.label, color: ['#f87171', '#34d399', '#60a5fa'][i] })));

      buildChartBlock(container, 'Thresholds', 'mV',
        FIELD_CATALOG.filter(f => f.group === 'Thresholds')
          .map((f, i, arr) => ({ key: f.key, label: f.label, color: distinctColor(i, arr.length) })),
        { advanced: true });
    }

    function switchView(view) {

      document.getElementById('tab-btn-graphs').classList.toggle('active', !isTable);
      if (!isTable) allCharts.forEach(c => c.draw());
    }

    function refreshCharts() {
      allCharts.forEach(c => c.setData(packets));
    }

    // ── Uplink command maker ─────────────────────────────────────────────────

    const UPLINK_COMMANDS = [

    let selectedUplinkCmd = null;

    function hex2(n) { return n.toString(16).toUpperCase().padStart(2, '0'); }

    function renderUplinkList() {
      const q = document.getElementById('uplink-search').value.trim().toLowerCase();
      const listEl = document.getElementById('uplink-list');
      const categories = [...new Set(UPLINK_COMMANDS.map(c => c.category))];
      let html = '';
      categories.forEach(cat => {
        const items = UPLINK_COMMANDS
          .map((c, i) => ({ ...c, i }))
          .filter(c => c.category === cat)
          .filter(c => !q || c.name.toLowerCase().includes(q) || c.description.toLowerCase().includes(q));
        if (!items.length) return;
        html += `<div class="uplink-cat">${cat}</div>`;
        html += items.map(c => `
          <div class="uplink-item${selectedUplinkCmd === c.i ? ' selected' : ''}" onclick="selectUplinkCommand(${c.i})">
            <div class="uplink-item-name">${c.name}
              <span class="uplink-item-code">0x${hex2(c.code)}</span>
              ${c.param ? '<span class="uplink-item-param">PARAM</span>' : ''}
            </div>
            <div class="uplink-item-desc">${c.description}</div>
          </div>`).join('');
      });
      listEl.innerHTML = html || '<div class="empty" style="margin-top:40px">No commands match.</div>';
    }

    function selectUplinkCommand(i) {
      selectedUplinkCmd = i;
      renderUplinkList();
      buildUplinkDetail(UPLINK_COMMANDS[i]);
    }

    function buildUplinkDetail(cmd) {
      const detail = document.getElementById('uplink-detail');
      const paramRow = cmd.param ? `
        <div class="uplink-param-row">
          <label class="uplink-param-label">${cmd.paramLabel || 'Value'} — raw byte (0–255)</label>
          <input type="number" min="0" max="255" value="0" class="uplink-param-input" id="uplink-param-input" oninput="updateUplinkResult()">
          <div class="uplink-param-hint">Sent as-is, 1 byte (0x00–0xFF). No unit conversion applied yet.</div>
        </div>` : '';

      detail.innerHTML = `
        <div class="uplink-detail-cat">${cmd.category}</div>
        <div class="uplink-detail-title">${cmd.name}</div>
        <div class="uplink-detail-desc">${cmd.description}</div>
        ${paramRow}
        <div class="uplink-result">
          <div class="uplink-result-bytes" id="uplink-result-bytes"></div>
          <button class="btn copy-btn" id="uplink-copy-btn" onclick="copyUplinkResult()">📋&thinsp;Copy</button>
        </div>
      `;
      updateUplinkResult();
    }

    function updateUplinkResult() {
      const cmd = UPLINK_COMMANDS[selectedUplinkCmd];
      if (!cmd) return;
      let byte2 = cmd.fixed2;
      if (cmd.param) {
        const input = document.getElementById('uplink-param-input');
        let v = parseInt(input.value, 10);
        if (!Number.isFinite(v)) v = 0;
        v = Math.max(0, Math.min(255, v));
        input.value = v;
        byte2 = v;
      }
      document.getElementById('uplink-result-bytes').textContent = `0x${hex2(cmd.code)} 0x${hex2(byte2)}`;
    }

    async function copyUplinkResult() {
      const text = document.getElementById('uplink-result-bytes').textContent;
      const btn = document.getElementById('uplink-copy-btn');
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      btn.textContent = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 1200);
    }

    function switchMode(mode) {
      const isDownlink = mode === 'downlink';
      document.getElementById('downlink-view').style.display = isDownlink ? 'contents' : 'none';
      document.getElementById('uplink-view').style.display = isDownlink ? 'none' : 'flex';
      document.getElementById('mode-btn-downlink').classList.toggle('active', isDownlink);
      document.getElementById('mode-btn-uplink').classList.toggle('active', !isDownlink);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initDefaultCharts();
      renderUplinkList();
    });

    // ── Decode ─────────────────────────────────────────────────────────────

    async function decodeInput() {
      const text = document.getElementById('input-area').value;
      if (!text.trim()) { setStatus('Nothing to decode.', 'warn'); return; }
      await run({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
    }

    async function openFile(input) {
      const file = input.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      await run({ method: 'POST', body: fd });
      input.value = '';
    }

    async function run(opts) {
      setStatus('Decoding…', 'info');
      try {
        const resp = await fetch('/decode', opts);
        if (!resp.ok) throw new Error(`Server error ${resp.status}`);
        const data = await resp.json();
        packets = data.packets;
        activeTr = null;
        buildTable(packets);
        refreshCharts();
        updateHeaderStats(data);
        if (data.decoded > 0) {
          setStatus(
            `Decoded ${data.decoded} packet(s).` +
            (data.ignored ? `  ${data.ignored} line(s) skipped.` : '') +
            '  Click a row to inspect it.',
            'ok');
        } else {
          setStatus(`No packets found — ${data.ignored} line(s) scanned.`, 'warn');
        }
      } catch (e) {
        setStatus(`Error: ${e.message}`, 'error');
      }
    }

    function clearAll() {
      document.getElementById('input-area').value = '';
      packets = []; activeTr = null; currentPkt = null;
      buildTable([]);
      refreshCharts();
      document.getElementById('detail-scroll').innerHTML =
        '<div class="empty" style="margin-top:60px">Select a packet to inspect it.</div>';
      document.getElementById('header-stats').innerHTML = '';
      setStatus('Ready — paste data or open a file, then click Decode.', 'idle');
    }

    // ── CSV download ───────────────────────────────────────────────────────

    function downloadCsv() {
      if (!packets.length) { alert('No packets to export.'); return; }
      const rows = [CSV_HEADER.join(','), ...packets.map(p => CSV_HEADER.map(k => esc_csv(p[k])).join(','))];
      const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(new Blob([rows.join('\r\n')], { type: 'text/csv' })),
        download: 'downlink_decoded.csv',
      });
      a.click();
    }

    function esc_csv(v) {
      const s = String(v ?? '');
      return (s.includes(',') || s.includes('"') || s.includes('\n'))
        ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    // ── Table ──────────────────────────────────────────────────────────────

    function fmtTs(ts) {
      if (!ts || ts === '0') return '—';
      return ts.replace('T', ' ').replace('+00:00', '').replace(/\.\d+/, '') + ' Z';
    }

    function buildTable(pkts) {
      const tbody = document.getElementById('tbody');
      if (!pkts.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">No packets decoded yet.</td></tr>';
        return;
      }
      tbody.innerHTML = pkts.map((p, i) => `
        <tr class="${p.crc_ok ? '' : 'bad'}" onclick="pickRow(this, ${i})">
          <td class="dim">${p.packet_number}</td>
          <td>${p.sequence_number}</td>
          <td>${fmtTs(p.timestamp_utc)}</td>
          <td style="text-align:right">${Number(p.altitude_m).toLocaleString()}</td>
          <td style="text-align:right">${p.pressure_mbar}</td>
          <td>${p.satellite_count_range}</td>
          <td>${p.crc_ok
            ? '<span class="badge ok">&#10003; OK</span>'
            : '<span class="badge fail">&#10007; FAIL</span>'}</td>
        </tr>`).join('');
    }

    function pickRow(tr, idx) {
      if (activeTr) activeTr.classList.remove('selected');
      tr.classList.add('selected');
      activeTr = tr;
      currentPkt = packets[idx];
      buildDetail(currentPkt);
    }

    // ── Detail ─────────────────────────────────────────────────────────────

    function toggleAdvanced(checked) {
      showAdvanced = checked;
      if (currentPkt) buildDetail(currentPkt);
      document.getElementById('graphs-view').classList.toggle('show-advanced', checked);
      allCharts.forEach(c => c.draw());
    }

    function buildDetail(pkt) {
      const html = GROUPS.filter(g => showAdvanced || !g.advanced).map(g => {
        const color = g.color ?? (pkt.crc_ok ? '#34d399' : '#f87171');
        let body = '';

        if (g.sipm) {
          body = '<div class="sipm-grid">' +
            g.fields.map(f => {
              const ch  = f.match(/(\d+)/)[1];
              const val = pkt[f] ?? 0;
              return `<div class="sipm-cell">
                <div class="sipm-ch">ch${ch}</div>
                <div class="sipm-val${val > 0 ? ' lit' : ''}">${val}</div>
              </div>`;
            }).join('') +
            '</div>';
        } else {
          body = g.fields.map(f => {
            const raw = pkt[f] ?? '';
            let cls = 'dg-val';
            if (f === 'crc_ok' || f === 'frame_ok') cls += raw ? ' good' : ' bad';
            if (f === 'raw_hex') cls += ' hex';
            return `<div class="dg-row">
              <div class="dg-key">${f}</div>
              <div class="${cls}">${raw}</div>
            </div>`;
          }).join('');
        }

        return `<div class="dg">
          <div class="dg-head">
            <div class="dg-stripe" style="background:${color}"></div>
            ${g.title}
          </div>
          ${body}
        </div>`;
      }).join('');

      document.getElementById('detail-scroll').innerHTML = html;
    }

    // ── Stats & status ─────────────────────────────────────────────────────

    function updateHeaderStats(data) {
      const failed = data.packets.filter(p => !p.crc_ok).length;
      document.getElementById('header-stats').innerHTML =
        `<span class="pill pill-blue"><span class="pill-dot"></span>${data.decoded} packets</span>` +
        (failed
          ? `<span class="pill pill-red"><span class="pill-dot"></span>${failed} CRC fail</span>`
          : `<span class="pill pill-green"><span class="pill-dot"></span>All CRC OK</span>`) +
        (data.ignored ? `<span class="pill pill-gray">${data.ignored} skipped</span>` : '');
    }

    function setStatus(msg, type = 'idle') {
      const cfg = STATUS[type] || STATUS.idle;
      const bar = document.getElementById('status-bar');
      bar.style.background = cfg.bg;
      bar.style.color = cfg.color;
      document.getElementById('status-msg').textContent = msg;
    }

    // ── Detail panel resize ─────────────────────────────────────────────────

    (function initResize() {
      const handle = document.getElementById('resize-handle');
      const detailWrap = document.getElementById('detail-wrap');
      const MIN_WIDTH = 260, MAX_WIDTH = 900;

      const saved = parseInt(localStorage.getItem('detailPanelWidth'), 10);
      if (saved) detailWrap.style.width = Math.min(MAX_WIDTH, Math.max(MIN_WIDTH, saved)) + 'px';

      let dragging = false, startX = 0, startWidth = 0;

      handle.addEventListener('mousedown', (e) => {
        dragging = true;
        startX = e.clientX;
        startWidth = detailWrap.getBoundingClientRect().width;
        handle.classList.add('dragging');
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });

      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        const newWidth = Math.min(MAX_WIDTH, Math.max(MIN_WIDTH, startWidth + (startX - e.clientX)));
        detailWrap.style.width = newWidth + 'px';
      });

      window.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        handle.classList.remove('dragging');
        document.body.style.userSelect = '';
        localStorage.setItem('detailPanelWidth', parseInt(detailWrap.style.width, 10));
      });
    })();
  </script>
</body>
</html>
